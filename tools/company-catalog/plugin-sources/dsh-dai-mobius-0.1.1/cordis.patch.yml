# dsh-dai-mobius bundle patch: mounts the mobius plugin into the host
# composition of a dsh profile. The plugin registers its `mobius_*` tools
# into the shared `tools` registry and one usage section into the global
# system prompt, so every session of the profile can drive the Mobius
# sequential research workflow through natural language ("我要研究 xxx").
#
# The row id is deliberately `mobius` (NOT `agent-teams`) so this plugin can
# coexist with a separately-installed dsh-dai-agent-teams, whose own bundle
# row keeps the `agent-teams` id. A shared id would make the later bundle
# layer silently replace the earlier one in the composed config tree.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). The `dsh plugin` command pnpm-installs the package into the profile
# and reconciles it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: mobius
      # Node-resolvable package name — must stay in sync with package.json
      # `name`. Quoted because `@` is a reserved indicator in YAML and cannot
      # open a plain scalar.
      name: 'dsh-dai-mobius'
      config:
        # Workflow state lives under `<session workspace>/<stateDir>/mobius/`
        # (mobius.json), kept separate from an agent-teams `team.json`.
        stateDir: .agent-teams
        # Provider used to spawn step agents ('spawn' or 'fork').
        memberProvider: spawn
