name: Windows Package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Unsigned Windows x64 NSIS installer + portable archive, mirroring the
  # proven desktop-windows CI job, with artifacts uploaded for download.
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      # dist:win self-runs check:win-package (Windows-relevant gates only).
      # The root `yarn check` is skipped: upstream module-resolution.spec.ts
      # asserts POSIX-style file URLs and cannot pass on Windows runners.
      - name: Build Windows installer
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      - name: Install smoke test (silent, diagnostic)
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "dsh-plugin-desktop/dist/*-Setup.exe").FullName
          $target = Join-Path $env:LOCALAPPDATA "Programs\DSH Desktop"
          Write-Host "Installing $installer"
          $p = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru
          $deadline = (Get-Date).AddMinutes(8)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $files = @(Get-ChildItem $target -Recurse -File -ErrorAction SilentlyContinue).Count
            Write-Host "installer running, extracted files so far: $files"
          }
          if (-not $p.HasExited) {
            Write-Host '=== installer still alive after 8 min, diagnostics ==='
            Get-Process | Where-Object { $_.Name -match 'DSH|Desktop|un_A|electron' } |
              Format-Table Id,Name,Path -AutoSize | Out-String | Write-Host
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process 'DSH Desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'silent install did not finish within 8 minutes (see file-growth log above)'
          }
          if ($p.ExitCode -ne 0) { throw "silent install exited with $($p.ExitCode)" }
          $exe = Join-Path $target 'DSH Desktop.exe'
          if (-not (Test-Path $exe)) { throw "installed exe not found: $exe" }
          $total = @(Get-ChildItem $target -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "silent install OK: $exe ($total files)"
      - name: Print artifact hashes
        shell: pwsh
        run: Get-FileHash dsh-plugin-desktop/dist/*.exe -Algorithm SHA256 | Format-List
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: |
            dsh-plugin-desktop/dist/*.exe
            dsh-plugin-desktop/dist/*.zip
          if-no-files-found: error
