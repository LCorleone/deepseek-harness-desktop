name: Company catalog publish

# Full-auto catalog listing (manual dispatch), split across the network
# boundary: the GitHub runner measures, fills, signs, and verifies the
# manifest, then uploads it as a build artifact — it NEVER touches GitLab
# (the runner cannot reach the intranet origin, verified empirically).
# Publishing is done on the intranet side by tools/company-catalog/
# publish-local.mjs, which downloads the artifact, re-verifies it,
# ratchet-checks the sequence against the deployed manifest, pushes the
# canonical bytes to the GitLab config repo, and re-reads the raw URL.
#
# Sequence source on the runner: the in-repo state file
# tools/company-catalog/state/last-sequence.json (the GitHub-side ratchet).
# The workflow floors the new sequence at state+1; publish-local separately
# requires artifact.sequence == deployed+1 against GitLab, so a stale or
# ahead state file fails closed on the intranet side and can never publish
# a sequence clients may have seen. After a successful publish, a human
# commits the state bump (state → the published sequence) to this repo.
#
# Boundary (red line): this workflow NEVER modifies tools/company-catalog/
# allowlist.json in this repository. The treeDigest fill happens on a runtime
# copy inside the job; landing a measured digest in the reviewed allowlist
# stays a human review commit. The only publishing artifact is the signed
# catalog-manifest.json inside the company-catalog-signed artifact, produced
# by the pipeline (canonical single line — never reformatted, the desktop
# verifies the exact bytes). Signing key material lives only in repository
# secrets and is referenced, never echoed. No GitLab credentials exist in
# this workflow at all.
#
# dry-run semantics: dry-run=true runs the exact same measure → fill → sign
# → verify chain on the runner but uploads NO artifact — the signed bytes die
# with the runner and nothing can be published from them. dry-run=false adds
# the company-catalog-signed artifact upload (still nothing is pushed
# anywhere by this workflow).
#
# Artifact transport redundancy: a non-dry-run ALSO mirrors the artifact's
# contents to the catalog-artifacts branch (<run-id>/catalog-manifest.json +
# <run-id>/publish-meta.json + <run-id>/packages/*.tgz, newest 5 run
# directories kept). Reason: some
# intranet environments cannot reach GitHub's artifact blob storage at all
# (gh run download always times out) while GitHub's git transport works —
# publish-local falls back to that branch automatically when the download
# fails (or takes it directly via --from-git). The artifact stays the
# authoritative channel: a mirror push failure never fails this workflow
# (job-level continue-on-error; the failure is recorded in the run summary),
# and integrity never depends on the transport — publish-local runs the
# unchanged sha256 + signature + sequence-ratchet gauntlet on mirror bytes
# too, so a tampered branch is rejected exactly like a tampered artifact.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run — measure, build, sign, and verify only (no artifact upload; publishing is always intranet-side)'
        type: boolean
        default: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

# The measure-and-publish job runs with the workflow-level contents: read;
# only the mirror job below widens to contents: write, and only there — that
# job does nothing but copy the already-uploaded artifact bytes onto the
# catalog-artifacts branch.

jobs:
  measure-and-publish:
    runs-on: windows-latest
    env:
      # Secret copy for the step-level `if` below (secrets cannot appear in a
      # step `if` directly; GitHub rejects the workflow file at parse time).
      PINNED_KEY_FINGERPRINT: ${{ secrets.COMPANY_CATALOG_KEY_FINGERPRINT }}
      # The deployment's catalog origin (the intranet GitLab the tarball
      # channel hosts on), from an optional repository variable — same
      # optional-input discipline: an unset variable must never arrive as a
      # poisoned empty string, so it is copied to env and exported below only
      # when non-empty. Tarball-channel allowlist entries refuse to load
      # without it; npm-only allowlists never need it.
      CATALOG_ORIGIN_VAR: ${{ vars.COMPANY_CATALOG_ORIGIN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      # The CLI verifies/signs through the market library; the measure script
      # hashes through the compiled desktop boot-verification chunk.
      - name: Build market signing library
        run: yarn workspace dsh-community-market build
      - name: Build desktop lib (boot-verification chunk)
        run: yarn workspace dsh-plugin-desktop build
      - name: Sequence state preflight (in-repo ratchet)
        # The state file is the GitHub-side sequence floor the next step signs
        # against; it must be a tracked file in this repository. A missing
        # state file would floor the sequence at 0 and produce an artifact the
        # intranet publisher would (correctly) refuse — fail here instead,
        # with the fix spelled out.
        shell: pwsh
        run: |
          $statePath = 'tools/company-catalog/state/last-sequence.json'
          if (-not (Test-Path $statePath)) {
            throw "$statePath is missing from the checkout — the sequence state file must be committed to the repository (it is the GitHub-side ratchet). Commit it, then re-run."
          }
          $state = Get-Content $statePath -Raw | ConvertFrom-Json
          if (-not ($state.lastSequence -ge 0)) {
            throw "$statePath carries no non-negative lastSequence — refusing to guess the sequence floor"
          }
          "sequence floor: state lastSequence = $($state.lastSequence) → this run signs sequence $($state.lastSequence + 1)"
      - name: Export the company catalog origin (optional repository variable)
        # Tarball-channel entries validate against the deployment's pinned
        # origin (COMPANY_CATALOG_ORIGIN) — exported before the pack, measure,
        # and publish steps, which all load the allowlist. Only exported when
        # the repository variable is set: an empty value would fail origin
        # validation, and npm-only allowlists need no origin at all.
        if: env.CATALOG_ORIGIN_VAR != ''
        run: 'echo "COMPANY_CATALOG_ORIGIN=$env:CATALOG_ORIGIN_VAR" >> $env:GITHUB_ENV'
      - name: Pack tarball-channel artifacts (allowlist pack-artifact entries)
        # The tarball channel's pack step: every allowlist entry whose source
        # pins a path gets its deterministic .tgz packed here from the
        # plugin-sources tree, BEFORE anything measures or signs it — the
        # measure and measure-and-publish steps resolve source.path against
        # these artifacts. With no such entry (today's npm-only allowlist) the
        # step is an explicit no-op. --no-measure: the treeDigest measurement
        # for path-pinned entries happens once, in the measure step below.
        run: node tools/company-catalog/cli.mjs pack-tarball --from-allowlist --no-measure
      - name: Stage the packed tarballs for the artifact upload
        # The upload layout publish-local replays: the signed pair plus every
        # packed .tgz under packages/ next to it (planTarballPushes reads
        # <artifact-dir>/packages/<filename>, and the catalog-artifacts mirror
        # branch carries the same shape). The artifacts themselves stay at the
        # repo-relative path the allowlist pins (the default out/packages).
        shell: pwsh
        run: |
          if (Test-Path tools/company-catalog/out/packages) {
            New-Item -ItemType directory -Force run/packages | Out-Null
            Copy-Item tools/company-catalog/out/packages/*.tgz run/packages/
            "staged $(@(Get-ChildItem run/packages -Filter *.tgz).Count) packed tarball(s) into run/packages/ for the artifact upload"
          } else {
            'no packed tarballs to stage (the allowlist pins no source.path artifact)'
          }
      - name: Measure installed-tree root digests
        # Real installs through the repository-pinned pnpm 11.8.0 against
        # registry.npmjs.org, digested with the compiled
        # computeDesktopBootTreeRootDigest — the exact function the desktop's
        # boot verification applies to the user's installed tree.
        run: node tools/company-catalog/measure.mjs --out run/tree-digests.json --desktop-lib dsh-plugin-desktop/lib
      - name: Digest table → step summary
        shell: pwsh
        run: |
          $records = @(Get-Content run/tree-digests.json -Raw | ConvertFrom-Json)
          $lines = @('## Measured tree digests', '')
          if ($records.Count -eq 0) {
            $lines += @( '_no allowlist entry lacked a treeDigest — nothing measured', '' )
          } else {
            $lines += @('| package | version | treeDigest |', '| --- | --- | --- |')
            foreach ($record in $records) { $lines += "| $($record.packageName) | $($record.version) | ``$($record.treeDigest)`` |" }
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")
      # Optional trust-root pin: only exported when the secret exists, so an
      # unset optional secret can never arrive as a poisoned empty string.
      # (secrets cannot be referenced from a step-level `if` — GitHub rejects
      # the whole workflow file — so the check reads the job-level env copy.)
      - name: Pin the deployment trust-root fingerprint
        if: env.PINNED_KEY_FINGERPRINT != ''
        run: 'echo "COMPANY_CATALOG_KEY_FINGERPRINT=$env:PINNED_KEY_FINGERPRINT" >> $env:GITHUB_ENV'
      - name: measure-and-publish (fill → build against the in-repo state → sign → verify)
        # Fail-closed by construction: this step must exit 0 (registry dist
        # fetch, sequence floor from the in-repo state file, sign, full
        # round-trip verify, disk re-verify) before any artifact is uploaded.
        # No --sequence-from: the runner cannot read the intranet GitLab raw
        # URL, so the in-repo state file is the sequence source here; the
        # deployed-manifest cross-check happens intranet-side in
        # publish-local.mjs (artifact.sequence must equal deployed + 1).
        env:
          COMPANY_CATALOG_SIGNING_KEY: ${{ secrets.COMPANY_CATALOG_SIGNING_KEY }}
          COMPANY_CATALOG_KEY_ID: ${{ secrets.COMPANY_CATALOG_KEY_ID }}
        run: >-
          node tools/company-catalog/cli.mjs measure-and-publish
          --digest-file run/tree-digests.json
          --state-dir tools/company-catalog/state
          --out run/catalog-manifest.json
          --meta-out run/publish-meta.json
      - name: Record the build identity in publish-meta.json
        # The CLI writes sequence/keyId/fingerprint/entries/manifestSha256;
        # the runner adds the git/build identity publish-local echoes in its
        # commit message and completion summary.
        shell: pwsh
        run: |
          $meta = Get-Content run/publish-meta.json -Raw | ConvertFrom-Json
          $meta | Add-Member -NotePropertyName gitSha -NotePropertyValue $env:GITHUB_SHA -Force
          $meta | Add-Member -NotePropertyName runId -NotePropertyValue $env:GITHUB_RUN_ID -Force
          $meta | Add-Member -NotePropertyName runUrl -NotePropertyValue $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID -Force
          $meta | ConvertTo-Json -Depth 8 | Set-Content run/publish-meta.json -NoNewline
          "sequence=$($meta.sequence)" >> $env:GITHUB_ENV
          "fingerprint=$($meta.fingerprint)" >> $env:GITHUB_ENV
          "keyId=$($meta.keyId)" >> $env:GITHUB_ENV
      - name: Publish summary (sequence, fingerprint, entries, intranet command)
        shell: pwsh
        run: |
          $meta = Get-Content run/publish-meta.json -Raw | ConvertFrom-Json
          $manifest = Get-Content run/catalog-manifest.json -Raw | ConvertFrom-Json
          $entryLines = foreach ($entry in $meta.entries) {
            $digest = if ($entry.PSObject.Properties['treeDigest']) { "``$($entry.treeDigest)``" } else { '_none (gradual enablement)_' }
            $measured = if ($entry.measured) { 'measured' } else { 'unmeasured' }
            "- $($entry.packageName)@$($entry.version) treeDigest $($digest) ($measured)"
          }
          $summary = @(
            '## Company catalog manifest',
            '',
            "- sequence: **$($meta.sequence)** (floor: the in-repo state file; the intranet publisher additionally requires deployed + 1)",
            "- keyId: $($meta.keyId)",
            "- fingerprint: ``$($meta.fingerprint)``",
            "- manifest sha256: ``$($meta.manifestSha256)``",
            "- built from commit $($meta.gitSha)",
            '- entries:',
            $entryLines,
            ''
          )
          if ('${{ inputs.dry-run }}' -eq 'true') {
            $summary += @(
              '## DRY RUN — no artifact was uploaded',
              '',
              "The manifest at sequence $($meta.sequence) was measured, built, signed, and verified on this runner only. No artifact exists, nothing can be published from this run, and the signed bytes are gone with the runner. Re-run this workflow with dry-run unchecked to produce the publishable artifact.",
              ''
            )
          } else {
            $summary += @(
              '## 产物待内网侧发布 · artifact ready for the intranet side',
              '',
              'On a machine that can reach both GitHub and the intranet GitLab (gh authenticated, GITLAB_TOKEN exported):',
              '',
              '```sh',
              "node tools/company-catalog/publish-local.mjs --run $($meta.runId)",
              '```',
              '',
              "The same artifact contents are also mirrored to the ``catalog-artifacts`` branch under ``$($meta.runId)/`` (signed pair + packed tarballs under ``packages/``) — publish-local falls back to that branch automatically when the artifact download is unreachable, so the command above works unchanged either way.",
              '',
              "publish-local verifies the artifact signature, requires sequence $($meta.sequence) = GitLab deployed + 1, pushes the canonical bytes to master, and re-reads the raw URL. After it succeeds, commit the state bump in this repository: \`tools/company-catalog/state/last-sequence.json\` → \`{ `"lastSequence`": $($meta.sequence) }\`.",
              ''
            )
            # Fleet-upgrade gate hint: when this artifact carries treeDigest
            # entries that the deployed manifest may not have yet, the first
            # authoritative publish needs the explicit acknowledgement
            # (older clients reject the whole manifest on unknown fields).
            $digestEntries = @($meta.entries | Where-Object { $_.PSObject.Properties['treeDigest'] })
            if ($digestEntries.Count -gt 0) {
              $summary += @(
                '**Fleet-upgrade gate**: this manifest signs `treeDigest` entries. If the deployed manifest does not yet carry `treeDigest` on the same entries, publish-local refuses the push unless `--confirm-fleet-upgraded` is passed — the first authoritative publish requires every client to already run a field-aware build (older clients reject the **entire** manifest on one unknown key; see the publication gate in `tools/company-catalog/README.md`):',
                '',
                '```sh',
                "node tools/company-catalog/publish-local.mjs --run $($meta.runId) --confirm-fleet-upgraded",
                '```',
                ''
              )
            }
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Join("`n", $summary))
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry-run == false }}
        with:
          name: company-catalog-signed
          # run/packages/ (the packed tarballs) uploads next to the signed
          # pair: upload-artifact strips the shared run/ prefix, so the
          # artifact root carries catalog-manifest.json, publish-meta.json,
          # and packages/*.tgz — the layout publish-local replays and pushes.
          path: |
            run/catalog-manifest.json
            run/publish-meta.json
            run/packages/
          if-no-files-found: error

  # Auxiliary transport for environments that cannot reach GitHub's artifact
  # blob storage (gh run download) but can reach GitHub over git: copy the
  # just-uploaded artifact — the signed pair plus the packed tarballs — onto
  # the catalog-artifacts branch under <run-id>/. Job-scoped permissions —
  # contents: write lives ONLY here, the measure-and-publish job above keeps
  # contents: read. The artifact remains the authoritative channel:
  # continue-on-error keeps a mirror failure from reddening the workflow,
  # and the failure is recorded in the run summary.
  mirror-signed-artifacts:
    needs: measure-and-publish
    if: ${{ inputs.dry-run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    env:
      ARTIFACTS_BRANCH: catalog-artifacts
      KEEP_RUNS: '5'
    steps:
      # persist-credentials defaults to true here — the push below needs the
      # job-scoped GITHUB_TOKEN (no extra secret is involved).
      - uses: actions/checkout@v6
        with:
          path: mirror
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: company-catalog-signed
          path: incoming
      - name: Mirror the signed pair to <run-id>/ on the artifacts branch
        id: mirror
        working-directory: mirror
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          git config user.name 'DSH catalog pipeline'
          git config user.email 'catalog-pipeline@dsh-desktop.local'
          # The signed bytes must survive the round trip byte-exactly — no
          # eol conversion anywhere in the mirror.
          git config core.autocrlf false

          # Sync the mirror branch tip; the very first mirror creates it as
          # an orphan branch carrying only run directories.
          if git fetch --quiet --no-recurse-submodules origin "+refs/heads/${ARTIFACTS_BRANCH}:refs/remotes/origin/${ARTIFACTS_BRANCH}"; then
            git checkout --quiet -B "${ARTIFACTS_BRANCH}" "refs/remotes/origin/${ARTIFACTS_BRANCH}"
          else
            echo "mirror: no ${ARTIFACTS_BRANCH} branch yet — creating it as an orphan branch"
            git checkout --quiet --orphan "${ARTIFACTS_BRANCH}"
            git rm --quiet -rf --ignore-unmatch .
          fi

          cat > README.md <<'EOF'
          Machine branch written by the Company catalog publish workflow.

          Each successful non-dry-run run mirrors its signed pair plus the
          packed tarballs to <run-id>/catalog-manifest.json +
          <run-id>/publish-meta.json + <run-id>/packages/*.tgz (the
          company-catalog-signed artifact stays the authoritative channel).
          Only the newest run directories are kept; older ones are pruned.
          Integrity never depends on this transport: publish-local re-runs the
          sha256 + signature + sequence-ratchet checks on these bytes, and the
          tarball bytes against the signed integrity.
          EOF

          mkdir -p "${RUN_ID}"
          cp ../incoming/catalog-manifest.json ../incoming/publish-meta.json "${RUN_ID}/"
          # Carry the packed tarballs (the third piece of the artifact): the
          # workflow's pack step stages them under packages/, and
          # publish-local's git-branch fallback replays that exact layout.
          if compgen -G '../incoming/packages/*.tgz' > /dev/null; then
            mkdir -p "${RUN_ID}/packages"
            cp ../incoming/packages/*.tgz "${RUN_ID}/packages/"
            printf 'mirror: carrying %d packed tarball(s) under %s/packages/\n' \
              "$(find ../incoming/packages -maxdepth 1 -name '*.tgz' | wc -l)" "${RUN_ID}"
          else
            echo 'mirror: no packed tarballs in the artifact (npm-only manifest)'
          fi

          # Prune: keep the newest KEEP_RUNS run directories by numeric run id
          # (run ids are monotonic — the current run is the largest, just written).
          mapfile -t old_dirs < <(find . -mindepth 1 -maxdepth 1 -type d -regex '\./[0-9]+' -printf '%f\n' | sort -rn | tail -n "+$((KEEP_RUNS + 1))")
          if ((${#old_dirs[@]})); then
            printf 'mirror: pruning old run directories: %s\n' "${old_dirs[*]}"
            git rm --quiet -r "${old_dirs[@]}"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "mirror: nothing changed — run ${RUN_ID} is already mirrored"
          else
            git commit --quiet -m "mirror: run ${RUN_ID} signed catalog artifacts"
          fi

          # Concurrent runs can race on the branch tip. The refspec carries
          # no force marker: a push that is not a fast-forward is rejected
          # instead of silently discarding the other run's directory. Both
          # reachable states are fast-forwards by construction — orphan
          # first-creation (creating a new remote ref) and the replay below
          # (remote tip + this commit) — and if the replay finds this run's
          # commit already applied, the retried push is a no-op. On a
          # rejection: resync with the remote tip, replay this commit on
          # top, retry (no resync after the final attempt).
          for attempt in 1 2 3; do
            if git push --quiet origin "refs/heads/${ARTIFACTS_BRANCH}:refs/heads/${ARTIFACTS_BRANCH}"; then
              echo "mirror: run ${RUN_ID} mirrored to ${ARTIFACTS_BRANCH} (newest ${KEEP_RUNS} run directories kept)"
              exit 0
            fi
            if (( attempt < 3 )); then
              echo "mirror: push attempt ${attempt} rejected (non-fast-forward — a concurrent run moved the branch tip) — resyncing with the remote tip and retrying"
              sleep "$((attempt * 5))"
              git fetch --quiet --no-recurse-submodules origin "+refs/heads/${ARTIFACTS_BRANCH}:refs/remotes/origin/${ARTIFACTS_BRANCH}"
              git rebase "refs/remotes/origin/${ARTIFACTS_BRANCH}"
            fi
          done
          echo "mirror: giving up after 3 push attempts — the artifact upload in measure-and-publish remains the authoritative channel"
          exit 1
      - name: Record the mirror failure in the run summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## ⚠ catalog-artifacts mirror did not land'
            echo
            echo 'The signed company-catalog-signed artifact upload is unaffected and stays the authoritative channel. The git-branch mirror (for environments that reach GitHub over git but not its artifact blob storage) failed — inspect the mirror-signed-artifacts job log.'
          } >> "$GITHUB_STEP_SUMMARY"
